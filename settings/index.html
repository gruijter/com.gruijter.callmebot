<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
		<script type="text/javascript" src="settings.js" data-origin="settings"></script>
		<link rel="stylesheet" href="settings.css">
	</head>
	<body>
		<header class="homey-header">
			<h1 class="homey-title" data-i18n="settings.benefit">Let Homey send messages to your phone</h1>
		</header>

		<div class="tab-nav">
			<button id="tabb1" class="homey-button-primary" onclick="showTab(1)" data-i18n="settings.tab1.title">Settings</button>
			<button id="tabb2" class="homey-button-secondary" onclick="showTab(2)" data-i18n="settings.tab2.title">Log</button>
		</div>

		<!-- Instructions panel -->
		<div id="tab1">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.instructionsTitle">Instructions</legend>
				<p data-i18n="settings.tab1.instructions">Instructions</p>
			</fieldset>
		</div>

		<!-- Logging panel -->
		<div id="tab2" style="display: none;">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab2.title">Log</legend>
				<button id="deleteButton" class="homey-button-danger" onclick="deleteLogs()" data-i18n="settings.tab2.deleteLogs">Delete logs</button>
				<pre id="loglines"></pre>
			</fieldset>
		</div>
	</body>
</html>
